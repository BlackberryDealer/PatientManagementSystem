[package]
name = "patient-management-system"
version = "0.1.0"
edition = "2021"
description = "A Patient Management System built with Rust, Actix Web, Tera, and SQLx for CSC1106 Web Programming."

[dependencies]
actix-web = "4"
actix-rt = "2"
actix-session = { version = "0.9", features = ["cookie-session"] }
tera = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.15"
dotenv = "0.15"
env_logger = "0.11"
log = "0.4"
getrandom = "0.2"
